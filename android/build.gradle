
buildscript {
    // Kotlin 2.x is required by permission_handler_android 14.x, whose
    // build.gradle.kts uses the `kotlin { compilerOptions { jvmTarget } }` DSL
    // that does not exist in KGP 1.9. Compatible with Gradle 8.10.2 + AGP 8.1.2.
    // The classpath previously pinned 1.9.0 while ext said 1.9.20 — now one value.
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.2' // Check for the latest version
        classpath 'com.google.gms:google-services:4.4.2' // Check for the latest version
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
