
// Plugin versions (Android Gradle Plugin, Kotlin, Google Services) are
// declared in settings.gradle via the pluginManagement/plugins blocks.
// The legacy buildscript classpath entries were removed because they pinned a
// stale AGP (8.1.2) that conflicted with the AGP 8.9.1 declared in
// settings.gradle. AGP >= 8.5.1 is required so bundled native libraries are
// packaged with 16 KB page alignment for Google Play compatibility.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
