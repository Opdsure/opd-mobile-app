plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "5"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0.0"
}

android {
    namespace = "io.app.opdsure"
    compileSdk = 34
    ndkVersion = "27.0.12077973"



    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets{
        main.java.srcDirs+='src/main/kotlin'
    }

    defaultConfig {
        multiDexEnabled true
        applicationId = "io.app.opdsure"
        minSdk = 21
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()  /// TODO: Current Version Code is 5
        versionName = flutterVersionName  /// TODO: Current Version Name is 1.0.0
    }
    signingConfigs {
        release {
            storeFile file('/Users/intileotechnologies/Documents/Aman/opd_sure_app/android/opdsure.jks')
            storePassword 'Intileo@123'
            keyAlias 'opdsure'
            keyPassword 'Intileo@123'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
//            minifyEnabled true
            minifyEnabled false  // Change this to false
            shrinkResources false // Change this to false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.android.support:multidex:2.0.1'
}
