plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "5"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "io.app.opdsure"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"



    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets{
        main.java.srcDirs+='src/main/kotlin'
    }

    defaultConfig {
        multiDexEnabled true
        applicationId = "io.app.opdsure"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()  /// TODO: Current Version Code is 5
        versionName = flutterVersionName  /// TODO: Current Version Name is 1.0.0

        // Ship only 64-bit ABIs. Android's 16 KB page-size mode runs on
        // 64-bit devices only, and Google Play's 16 KB requirement applies to
        // 64-bit ABIs. Dropping the legacy 32-bit armeabi-v7a ABI removes the
        // only remaining 4 KB-aligned native libraries (pdfium's 32-bit .so),
        // guaranteeing a fully 16 KB-compatible bundle. 64-bit is also already
        // mandatory on Google Play.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    signingConfigs {
        release {
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
            storePassword keystoreProperties["storePassword"]
            storeFile keystoreProperties["storeFile"] ?
                    file(keystoreProperties["storeFile"]) : null
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Exclude the legacy 32-bit armeabi-v7a native libraries from the bundle.
    // The pdfium dependency ships 4 KB-aligned .so files for armeabi-v7a that
    // cannot be 16 KB aligned. Since Android's 16 KB page-size mode is 64-bit
    // only, dropping armeabi-v7a leaves just the fully 16 KB-aligned 64-bit
    // ABIs (arm64-v8a, x86_64). This is applied at packaging level so it is
    // honored regardless of Flutter's default abiFilters injection.
    packagingOptions {
        jniLibs {
            excludes += ["lib/armeabi-v7a/**"]
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.android.support:multidex:2.0.1'
}


