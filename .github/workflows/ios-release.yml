name: iOS Release (TestFlight)

# ─────────────────────────────────────────────────────────────────────────────
# Flow: Push/Dispatch -> Validate -> Test -> Keychain + cert + profile
#        -> Resolve build number (ASC) -> flutter build ipa (Apple distribution
#        signing) -> Verify IPA -> Upload to App Store Connect TestFlight
#
# Runs ONLY on a macOS runner (iOS tooling is macOS-only). This pipeline is
# completely independent of the Android pipeline (.github/workflows/
# android-release.yml) and shares NO secrets with it.
#
# Signing: Apple Distribution certificate + App Store provisioning profile,
# imported into a temporary keychain. App Store Connect uploads authenticate
# with an App Store Connect API key (.p8). The API key does NOT sign the app.
#
# Secrets required (GitHub repo settings → Secrets and variables → Actions):
#   Signing (manual distribution signing):
#     IOS_CERTIFICATE_BASE64          base64 of the Apple Distribution .p12
#     IOS_CERTIFICATE_PASSWORD        password for the .p12
#     IOS_PROVISIONING_PROFILE_BASE64 base64 of the App Store .mobileprovision
#     IOS_KEYCHAIN_PASSWORD           any strong string (temp keychain password)
#     IOS_BUNDLE_ID                   io.app.opdsure
#     IOS_PROVISIONING_PROFILE_NAME   the profile's NAME (as shown in Apple portal)
#   App Store Connect API (upload auth):
#     APP_STORE_CONNECT_API_KEY_ID        the Key ID (e.g. R8DWU66GG9)
#     APP_STORE_CONNECT_ISSUER_ID         the Issuer ID (UUID)
#     APP_STORE_CONNECT_API_KEY_BASE64    base64 of the .p8 private key
#   Team:
#     APPLE_TEAM_ID                   X8JCSQZDGC (optional; default below)
#
# TestFlight only. This workflow never submits for App Review or releases to
# the public App Store.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: >-
          Optional explicit iOS build number (CFBundleVersion). Leave blank to
          auto-derive from App Store Connect (latest TestFlight build + 1).
        required: false
        type: string
  push:
    branches:
      # Same release branches as the Android pipeline, kept in sync on purpose.
      - master
      - Aman--Dev

# Least-privilege: only read repository contents. No write access required.
permissions:
  contents: read

# Prevent overlapping iOS releases from racing on build-number assignment.
# Separate group from Android so the two pipelines never block each other.
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish (TestFlight)
    # iOS builds MUST run on macOS. macos-15 (Apple Silicon) — macos-14 is in
    # brownout/deprecation. macos-15 ships Xcode 16.x (default 16.4); it does
    # NOT include Xcode 15.4, so the Xcode selection below targets 16.4.
    runs-on: macos-15
    timeout-minutes: 90

    env:
      # Application identity. Must match PRODUCT_BUNDLE_IDENTIFIER in
      # ios/Runner.xcodeproj/project.pbxproj (verified: io.app.opdsure).
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # NOTE: the credential file paths (CERTIFICATE_PATH, PROFILE_PATH, etc.)
      # are intentionally NOT defined here. A job-level `env:` value is NOT
      # shell-expanded, so "$RUNNER_TEMP/..." would stay a literal string (bash
      # does not re-expand a variable's VALUE), which previously caused
      # "$RUNNER_TEMP/ios_distribution.p12: No such file or directory". They are
      # instead exported with the real, expanded $RUNNER_TEMP in the
      # "Set credential file paths" step below, so every later step receives
      # absolute paths.

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      # actions/checkout v4.2.2 (same pin as the Android workflow)
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # ── Resolve credential file paths (expanded $RUNNER_TEMP) ─────────────
      # Exports absolute paths for the runtime-decoded credential files to
      # $GITHUB_ENV so every later step sees real paths. This is done in a shell
      # (not job-level `env:`) because job `env:` values are not shell-expanded,
      # so "$RUNNER_TEMP/..." would otherwise stay a literal string.
      - name: Set credential file paths
        run: |
          set -euo pipefail
          {
            echo "CERTIFICATE_PATH=$RUNNER_TEMP/ios_distribution.p12"
            echo "PROFILE_PATH=$RUNNER_TEMP/ios_appstore.mobileprovision"
            echo "ASC_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8"
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/ios-signing.keychain-db"
            echo "EXPORT_OPTIONS_PATH=$RUNNER_TEMP/ExportOptions.plist"
          } >> "$GITHUB_ENV"
          echo "Credential file paths resolved under: $RUNNER_TEMP"

      # ── Select Xcode 26 (iOS 26 SDK) ──────────────────────────────────────
      # Apple requires uploads to be built with the iOS 26 SDK (Xcode 26+).
      # macos-15's DEFAULT Xcode is 16.4 (iOS 18.5 SDK), which App Store Connect
      # now rejects — so we MUST explicitly select an installed Xcode 26.x.
      # macos-15 ships Xcode 26.0.1/26.1.1/26.2/26.3; `26` resolves to the
      # latest installed 26.x. setup-xcode runs `xcode-select -s`, so every
      # later step (Flutter, CocoaPods, xcodebuild, flutter build ipa) uses it.
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      # ── Diagnostics + HARD SDK gate: fail before building if SDK < 26.0 ───
      # Prints the selected Xcode + iOS SDK, then fails the job if the iOS SDK
      # is below 26.0 so we never build an unacceptable IPA. No secrets printed.
      - name: Print toolchain versions and validate iOS SDK >= 26.0
        run: |
          set -euo pipefail
          echo "── macOS version ──"
          sw_vers
          echo "── Selected Xcode ──"
          xcode-select -p
          xcodebuild -version
          echo "── iOS SDK version ──"
          SDK_VER="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK = ${SDK_VER}"
          echo "── iOS SDKs available ──"
          xcodebuild -showsdks | grep -i ios || true
          # Compare MAJOR version numerically; require >= 26.
          SDK_MAJOR="${SDK_VER%%.*}"
          if [ -z "${SDK_MAJOR:-}" ] || [ "${SDK_MAJOR}" -lt 26 ]; then
            echo "::error::iOS SDK is ${SDK_VER} (< 26.0). Apple requires the iOS 26 SDK (Xcode 26+). Xcode 26 was not selected correctly."
            exit 1
          fi
          echo "iOS SDK ${SDK_VER} satisfies the >= 26.0 requirement."

      # ── Toolchain: Flutter 3.44.6 (same pin as Android) ───────────────────
      # subosito/flutter-action v2.19.0
      - name: Set up Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      # ── Enable Swift Package Manager (hybrid SPM + CocoaPods) ─────────────
      # razorpay_flutter 1.4.7 adds SPM support (ios/razorpay_flutter/Package.swift
      # depends on razorpay-pod, which vends RazorpayCore). We ENABLE SPM so that
      # plugin resolves via SPM. Flutter's hybrid model keeps CocoaPods for
      # plugins without SPM support (fluttertoast, smart_auth, etc.). This is the
      # default in Flutter 3.44, set explicitly here for determinism.
      - name: Enable Swift Package Manager (hybrid with CocoaPods)
        run: |
          set -euo pipefail
          flutter config --enable-swift-package-manager
          flutter config | grep -i "swift-package-manager" || true

      # ── Toolchain: Ruby + Bundler (for Fastlane) ──────────────────────────
      # ruby/setup-ruby v1.229.0 — installs gems from ios/Gemfile and caches.
      - name: Set up Ruby & Bundler
        uses: ruby/setup-ruby@354a1ad156761f5ee2b7b13fa8e09943a5e8d252
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      # ── Remove stale generated iOS Flutter config ────────────────────────
      # ios/Flutter/Generated.xcconfig is a MACHINE-SPECIFIC generated file
      # (it bakes in the absolute FLUTTER_ROOT of whoever last ran
      # `flutter pub get`). If a Windows-generated copy ever reaches the macOS
      # runner, CocoaPods tries to load a Windows path
      # (C:\src\flutter\...\podhelper) and fails. It is gitignored and no longer
      # tracked, but we also delete any stale copy here so the next step
      # regenerates it against the macOS Flutter SDK. ephemeral/ is removed too.
      - name: Remove stale generated iOS Flutter config
        run: |
          set -euo pipefail
          rm -f ios/Flutter/Generated.xcconfig
          rm -f ios/Flutter/flutter_export_environment.sh
          rm -rf ios/Flutter/ephemeral
          echo "Removed any stale generated iOS Flutter configuration."

      # ── Dart/Flutter dependencies (locked) ────────────────────────────────
      # Same enforce-lockfile policy as Android: use the committed pubspec.lock
      # exactly, never silently resolve newer plugin versions on CI.
      # `flutter pub get` regenerates ios/Flutter/Generated.xcconfig with the
      # CORRECT macOS FLUTTER_ROOT. `flutter precache --ios` ensures the iOS
      # engine artifacts referenced by that config are present.
      - name: Install Flutter dependencies (locked)
        run: |
          set -euo pipefail
          flutter precache --ios
          flutter pub get --enforce-lockfile

      # ── Static analysis (errors are fatal) ────────────────────────────────
      # Mirrors the Android gate: real analyzer ERRORS stop the build; the
      # pre-existing warning/info backlog is non-fatal to avoid blocking.
      - name: Static analysis (errors are fatal)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # ── Tests (mandatory when present) ────────────────────────────────────
      - name: Run tests
        run: |
          if grep -rqs --include='*.dart' 'void main' test 2>/dev/null; then
            flutter test
          else
            echo "No tests found under test/ — skipping flutter test."
          fi

      # ── Validate the regenerated Flutter config before CocoaPods ─────────
      # The Podfile loads <FLUTTER_ROOT>/packages/flutter_tools/bin/podhelper.
      # If FLUTTER_ROOT is wrong (e.g. a leftover Windows path), `pod install`
      # fails with a confusing "cannot load such file" error. Assert the path
      # is a real macOS Flutter SDK BEFORE running pod install, and fail with a
      # clear message otherwise. No secrets are read or printed.
      - name: Verify Flutter SDK path in Generated.xcconfig
        run: |
          set -euo pipefail
          CONFIG="ios/Flutter/Generated.xcconfig"
          if [ ! -f "$CONFIG" ]; then
            echo "::error::$CONFIG was not generated. 'flutter pub get' must run first."
            exit 1
          fi
          FLUTTER_ROOT="$(grep -E '^FLUTTER_ROOT=' "$CONFIG" | head -n1 | cut -d= -f2-)"
          echo "FLUTTER_ROOT = ${FLUTTER_ROOT:-<empty>}"
          if [ -z "${FLUTTER_ROOT:-}" ]; then
            echo "::error::FLUTTER_ROOT is empty in $CONFIG."
            exit 1
          fi
          case "$FLUTTER_ROOT" in
            *\\*|[A-Za-z]:*)
              echo "::error::FLUTTER_ROOT ('$FLUTTER_ROOT') looks like a Windows path. A stale Generated.xcconfig reached the runner; it must be regenerated by the macOS Flutter SDK."
              exit 1
              ;;
          esac
          if [ ! -d "$FLUTTER_ROOT" ]; then
            echo "::error::Flutter SDK directory does not exist: $FLUTTER_ROOT"
            exit 1
          fi
          PODHELPER="$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb"
          if [ ! -f "$PODHELPER" ]; then
            echo "::error::podhelper.rb not found at $PODHELPER. FLUTTER_ROOT is not a valid Flutter SDK."
            exit 1
          fi
          echo "Verified Flutter SDK: $FLUTTER_ROOT (podhelper.rb present)."

      # ── CocoaPods ─────────────────────────────────────────────────────────
      # Use the runner's preinstalled, modern CocoaPods (the committed
      # ios/Gemfile.lock pins an old cocoapods 1.10.2 that is incompatible with
      # recent Xcode/Flutter plugins; Bundler is used only for Fastlane).
      # Runs only AFTER the FLUTTER_ROOT verification above passes.
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          set -euo pipefail
          pod --version
          pod install --repo-update

      # ── Diagnostics: Razorpay native SDK linkage (NO secrets) ─────────────
      # Confirms the Razorpay native pod and its RazorpayCore module are present
      # in the generated Pods BEFORE the Xcode archive, so a missing-module
      # failure is explained here rather than deep in the Swift compile. Reads
      # only build metadata — no signing material or secrets.
      - name: Diagnostics - Razorpay SPM resolution & RazorpayCore
        run: |
          set -uo pipefail   # not -e: diagnostics run to completion
          echo "── razorpay_flutter resolved version (expect 1.4.7) ──"
          # Robust, portable parse: take the first `version:` line that appears
          # after the `razorpay_flutter:` block header in pubspec.lock, then
          # strip quotes/spaces with sed/tr. (No awk — avoids YAML/shell quote
          # escaping pitfalls.)
          RZ_BLOCK="$(grep -A 8 -E '^[[:space:]]+razorpay_flutter:' pubspec.lock || true)"
          RZ_VER="$(printf '%s\n' "$RZ_BLOCK" | grep -m1 'version:' | sed -E 's/.*version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/' || true)"
          echo "razorpay_flutter = ${RZ_VER:-<none>}"
          if [ "${RZ_VER:-}" != "1.4.7" ]; then
            echo "::error::razorpay_flutter is not 1.4.7 (got '${RZ_VER:-none}'); SPM support requires >= 1.4.7."
            exit 1
          fi

          echo "── razorpay_flutter SPM manifest (Package.swift) present in the plugin? ──"
          PLUGIN_SYMLINK="ios/.symlinks/plugins/razorpay_flutter"
          PKG="$(find "$PLUGIN_SYMLINK" -name Package.swift 2>/dev/null | head -n1)"
          if [ -z "${PKG:-}" ]; then
            # Fall back to the pub cache location if the symlink layout differs.
            PKG="$(find "$HOME/.pub-cache" "$FLUTTER_ROOT" -path '*razorpay_flutter*/ios/*/Package.swift' 2>/dev/null | head -n1 || true)"
          fi
          if [ -n "${PKG:-}" ]; then
            echo "Found Package.swift: $PKG"
            echo "── native razorpay-pod dependency declared in Package.swift ──"
            grep -iE 'razorpay-pod|RazorpayCheckout|RazorpayCore|\.package\(' "$PKG" || echo "(no razorpay-pod dependency lines matched)"
          else
            echo "::error::razorpay_flutter Package.swift (SPM manifest) not found; 1.4.7 should ship it."
            exit 1
          fi

          echo "── SPM integration in the generated Runner project (expected ENABLED) ──"
          PBX="ios/Runner.xcodeproj/project.pbxproj"
          if grep -Eiq 'FlutterGeneratedPluginSwiftPackage|XCSwiftPackageProductDependency|XCLocalSwiftPackageReference' "$PBX"; then
            echo "SwiftPM integration present (FlutterGeneratedPluginSwiftPackage) — razorpay_flutter resolves via SPM."
          else
            echo "::warning::No SwiftPM package references in Runner project. If razorpay_flutter is NOT also resolved via CocoaPods, the RazorpayCore import may fail."
          fi

          echo "── Flutter SPM package manifest (lists which plugins use SPM) ──"
          GEN_PKG="ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift"
          if [ -f "$GEN_PKG" ]; then
            echo "FlutterGeneratedPluginSwiftPackage dependencies:"
            grep -iE 'razorpay|fluttertoast|smart_auth|\.package\(' "$GEN_PKG" || echo "(no matching dependency lines)"
          else
            echo "(FlutterGeneratedPluginSwiftPackage/Package.swift not present)"
          fi

          echo "── CocoaPods fallback (non-SPM plugins still via pods) ──"
          echo "Podfile.lock pods:"; grep -iE 'razorpay|fluttertoast|smart_auth' ios/Podfile.lock 2>/dev/null || echo "(none of these in Podfile.lock)"
          echo "Manifest.lock present:"; [ -f ios/Pods/Manifest.lock ] && echo "yes" || echo "no"

          echo "── Resolved SPM checkout of razorpay-pod + RazorpayCore module (best-effort) ──"
          # When SPM resolves, Xcode checks the package out under DerivedData /
          # SourcePackages. This build hasn't archived yet, so just report any
          # razorpay-pod / RazorpayCore artifacts already present on disk.
          find ~/Library/Developer/Xcode/DerivedData ios -ipath '*razorpay-pod*' 2>/dev/null | head -n 20 || true
          find ~/Library/Developer/Xcode/DerivedData ios -iname '*RazorpayCore*' 2>/dev/null | head -n 20 || true
          echo "Razorpay SPM diagnostics complete."

      # ── Import Apple Distribution certificate into a temp keychain ────────
      # Nothing is printed. All credential material is decoded to files under
      # the runner temp dir and removed in the cleanup step.
      - name: Configure signing (keychain + certificate)
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${IOS_CERTIFICATE_BASE64:-}" ]; then
            echo "::error::IOS_CERTIFICATE_BASE64 secret is empty. Create an Apple Distribution certificate (.p12) and store its base64 as this secret."
            exit 1
          fi
          if [ -z "${IOS_KEYCHAIN_PASSWORD:-}" ]; then
            echo "::error::IOS_KEYCHAIN_PASSWORD secret is empty."
            exit 1
          fi

          # Decode the distribution certificate (.p12) to the EXACT path later
          # commands use ($CERTIFICATE_PATH = $RUNNER_TEMP/ios_distribution.p12).
          # `base64 --decode` on macOS tolerates embedded newlines, so this
          # handles both single-line and wrapped base64 secret formats. Fail
          # clearly if the decode produced nothing.
          if ! echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH" 2>/dev/null; then
            echo "::error::Failed to Base64-decode IOS_CERTIFICATE_BASE64. Ensure the secret is the base64 of the Apple Distribution .p12 (e.g. 'base64 -i cert.p12 | pbcopy'), with no extra quoting."
            exit 1
          fi

          # ── Safe diagnostics before import (no secret material printed) ────
          if [ ! -f "$CERTIFICATE_PATH" ]; then
            echo "::error::Certificate file was not created at $CERTIFICATE_PATH."
            exit 1
          fi
          CERT_SIZE="$(stat -f%z "$CERTIFICATE_PATH" 2>/dev/null || echo 0)"
          echo "Decoded certificate present at $CERTIFICATE_PATH (${CERT_SIZE} bytes)."
          if [ "${CERT_SIZE}" -le 0 ]; then
            echo "::error::Decoded certificate is empty (0 bytes) — check IOS_CERTIFICATE_BASE64."
            exit 1
          fi
          # Validate the .p12 structure with the password. -noout prevents any
          # certificate/key material from being printed; -passin env: keeps the
          # password off the command line. OpenSSL 3 (macos-15) may need
          # -legacy for older PKCS#12 encryption, so try both before failing.
          if openssl pkcs12 -info -in "$CERTIFICATE_PATH" -noout -passin env:IOS_CERTIFICATE_PASSWORD >/dev/null 2>&1 \
             || openssl pkcs12 -legacy -info -in "$CERTIFICATE_PATH" -noout -passin env:IOS_CERTIFICATE_PASSWORD >/dev/null 2>&1; then
            echo "Certificate validated as a PKCS#12 archive (password accepted)."
          else
            echo "::error::The decoded .p12 is not a valid PKCS#12 archive, or IOS_CERTIFICATE_PASSWORD is wrong. (No certificate contents are printed.)"
            exit 1
          fi

          # Create + unlock an isolated temporary keychain.
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the distribution certificate + private key.
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign/xcodebuild to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # Make the temp keychain the default search list (keep login keychain too).
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "Keychain created and distribution certificate imported."

      # ── Install the App Store provisioning profile ────────────────────────
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${IOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "::error::IOS_PROVISIONING_PROFILE_BASE64 secret is empty. Create an App Store provisioning profile for ${IOS_BUNDLE_ID} and store its base64 as this secret."
            exit 1
          fi
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          if [ ! -s "$PROFILE_PATH" ]; then
            echo "::error::Decoded provisioning profile is empty — check IOS_PROVISIONING_PROFILE_BASE64."
            exit 1
          fi
          # Install into the location Xcode reads profiles from. Decode the
          # signed profile to a plain plist first, then read its UUID.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          DECODED="${RUNNER_TEMP:-/tmp}/profile_decoded.plist"
          security cms -D -i "$PROFILE_PATH" > "$DECODED"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$DECODED")"
          rm -f "$DECODED"
          if [ -z "${UUID:-}" ]; then
            echo "::error::Could not read UUID from the provisioning profile."
            exit 1
          fi
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "Installed provisioning profile UUID: ${UUID}"
          echo "PROVISIONING_PROFILE_UUID=${UUID}" >> "$GITHUB_ENV"

      # ── Diagnostics: verify profile + certificate (NO secrets printed) ────
      # Prints only non-sensitive metadata (name, team, bundle id, expiry, UUID)
      # and asserts it matches the expected identity. Also confirms the imported
      # distribution identity is present in the temp keychain and that the
      # certificate embedded in the profile matches the imported certificate
      # (by comparing certificate fingerprints — no private-key material).
      - name: Verify signing assets (safe diagnostics)
        env:
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          PB=/usr/libexec/PlistBuddy
          DECODED="${RUNNER_TEMP:-/tmp}/profile_check.plist"
          security cms -D -i "$PROFILE_PATH" > "$DECODED"

          P_NAME="$("$PB" -c 'Print :Name' "$DECODED")"
          P_UUID="$("$PB" -c 'Print :UUID' "$DECODED")"
          P_TEAM="$("$PB" -c 'Print :TeamIdentifier:0' "$DECODED")"
          P_EXPIRE="$("$PB" -c 'Print :ExpirationDate' "$DECODED")"
          # Entitlements application-identifier is "<TEAMID>.<bundle id>".
          P_APPID="$("$PB" -c 'Print :Entitlements:application-identifier' "$DECODED" 2>/dev/null || echo '')"
          P_BUNDLE="${P_APPID#*.}"

          echo "Profile Name:        ${P_NAME}"
          echo "Profile UUID:        ${P_UUID}"
          echo "Profile Team:        ${P_TEAM}"
          echo "Profile Bundle ID:   ${P_BUNDLE}"
          echo "Profile Expiration:  ${P_EXPIRE}"

          FAIL=0
          if [ "${P_NAME}" != "${IOS_PROVISIONING_PROFILE_NAME}" ]; then
            echo "::error::Profile name '${P_NAME}' does not match IOS_PROVISIONING_PROFILE_NAME '${IOS_PROVISIONING_PROFILE_NAME}'. ExportOptions will not find the profile."
            FAIL=1
          fi
          if [ "${P_TEAM}" != "${APPLE_TEAM_ID:-X8JCSQZDGC}" ]; then
            echo "::error::Profile team '${P_TEAM}' does not match APPLE_TEAM_ID '${APPLE_TEAM_ID:-X8JCSQZDGC}'."
            FAIL=1
          fi
          if [ "${P_BUNDLE}" != "${IOS_BUNDLE_ID}" ] && [ "${P_BUNDLE}" != "*" ]; then
            echo "::error::Profile bundle id '${P_BUNDLE}' does not match IOS_BUNDLE_ID '${IOS_BUNDLE_ID}'."
            FAIL=1
          fi

          # Expiration check (shell-only; compares epoch seconds).
          if [ -n "${P_EXPIRE:-}" ]; then
            EXP_EPOCH="$(date -j -f '%a %b %d %H:%M:%S %Z %Y' "$P_EXPIRE" +%s 2>/dev/null || echo '')"
            NOW_EPOCH="$(date +%s)"
            if [ -n "$EXP_EPOCH" ] && [ "$EXP_EPOCH" -lt "$NOW_EPOCH" ]; then
              echo "::error::Provisioning profile expired on ${P_EXPIRE}."
              FAIL=1
            else
              echo "Profile expiration check passed (${P_EXPIRE})."
            fi
          fi

          # Certificate association: compare the SHA-1 fingerprint of the cert
          # embedded in the profile against certs in the temp keychain. Uses
          # PlistBuddy to export the first DeveloperCertificate as raw DER.
          PROFILE_CERT="${RUNNER_TEMP:-/tmp}/profile_cert.der"
          if "$PB" -c 'Print :DeveloperCertificates:0' "$DECODED" > "$PROFILE_CERT" 2>/dev/null && [ -s "$PROFILE_CERT" ]; then
            PROFILE_FP="$(openssl x509 -inform DER -in "$PROFILE_CERT" -noout -fingerprint -sha1 2>/dev/null | sed 's/.*=//' | tr -d ': ' || true)"
            KEYCHAIN_FPS="$(security find-certificate -a -Z "$KEYCHAIN_PATH" 2>/dev/null | awk '/SHA-1/{print $NF}' | tr -d ': ' || true)"
            if [ -n "${PROFILE_FP:-}" ] && echo "$KEYCHAIN_FPS" | grep -qi "$PROFILE_FP"; then
              echo "Certificate association OK: the profile's certificate is present in the keychain."
            else
              echo "::warning::Could not confirm the profile's certificate matches a certificate in the keychain. If signing fails, verify IOS_CERTIFICATE_BASE64 is the certificate used to create the '${IOS_PROVISIONING_PROFILE_NAME}' profile."
            fi
          else
            echo "::warning::Could not extract the certificate embedded in the profile for association check."
          fi

          # Confirm at least one Apple Distribution identity is usable.
          if security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -qi "Distribution"; then
            echo "Found an Apple Distribution code-signing identity in the keychain."
          else
            echo "::warning::No 'Distribution' code-signing identity found in the keychain. The imported .p12 must be an Apple Distribution certificate (with its private key)."
          fi

          rm -f "$DECODED" "$PROFILE_CERT" || true
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi

      # ── Force MANUAL distribution signing on the Runner target (CI only) ──
      # flutter build ipa archives using the Runner app target's Release build
      # settings, which in the committed project are CODE_SIGN_STYLE=Automatic
      # + "Apple Development". On a CI runner (no Apple ID / dev profile) the
      # archive cannot resolve a profile and fails. We rewrite the signing
      # settings ONLY for the Runner target, ONLY on the ephemeral runner
      # checkout (never committed), using Fastlane's purpose-built
      # update_code_signing_settings. This is TARGET-SCOPED, so the Pods
      # targets are untouched. It leaves the committed project and local
      # developer signing unchanged.
      - name: Force manual distribution signing (CI, Runner target only)
        env:
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        working-directory: ios
        run: |
          set -euo pipefail
          bundle exec fastlane configure_manual_signing

      # ── Decode the App Store Connect API key (.p8) ────────────────────────
      - name: Decode App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APP_STORE_CONNECT_API_KEY_BASE64:-}" ]; then
            echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 secret is empty."
            exit 1
          fi
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          if [ ! -s "$ASC_KEY_PATH" ]; then
            echo "::error::Decoded App Store Connect .p8 key is empty — check APP_STORE_CONNECT_API_KEY_BASE64."
            exit 1
          fi
          echo "App Store Connect API key decoded."

      # ── Resolve iOS build number (ASC latest + 1, or manual input) ────────
      # iOS build numbers are independent of the Android Play versionCode. We
      # ask App Store Connect for the latest processed TestFlight build and use
      # +1 so uploads never collide. A manual workflow_dispatch input overrides.
      - name: Resolve iOS build number
        id: bn
        env:
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        working-directory: ios
        run: |
          set -euo pipefail
          if [ -n "${INPUT_BUILD_NUMBER:-}" ]; then
            echo "Using manually provided build number: ${INPUT_BUILD_NUMBER}"
            echo "build_number=${INPUT_BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          OUT="$(bundle exec fastlane next_build_number 2>&1)"
          STATUS=$?
          set -e
          echo "$OUT"
          if [ $STATUS -ne 0 ]; then
            echo "::error::Failed to query App Store Connect for the next build number. Provide 'build_number' manually or check API key permissions/app record."
            exit 1
          fi
          NEXT="$(echo "$OUT" | grep -oE 'NEXT_BUILD_NUMBER=[0-9]+' | tail -n1 | cut -d= -f2)"
          if [ -z "${NEXT:-}" ]; then
            echo "::error::Could not parse NEXT_BUILD_NUMBER from Fastlane output."
            exit 1
          fi
          echo "Resolved next iOS build number: ${NEXT}"
          echo "build_number=${NEXT}" >> "$GITHUB_OUTPUT"

      # ── Resolve versionName from pubspec.yaml ─────────────────────────────
      - name: Resolve versionName
        id: vn
        run: |
          set -euo pipefail
          RAW="$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/version:[[:space:]]*//')"
          NAME="${RAW%%+*}"
          echo "Version name: ${NAME}"
          # Marketing version MUST exceed the approved App Store version (2.0.2).
          # Fail fast if it ever drifts back (e.g. to 1.26.0), which Apple rejects.
          if [ "${NAME}" != "2.0.3" ]; then
            echo "::error::CFBundleShortVersionString must be 2.0.3 (pubspec version name is '${NAME}'). Update pubspec.yaml 'version:' to 2.0.3+<build>."
            exit 1
          fi
          echo "version_name=${NAME}" >> "$GITHUB_OUTPUT"

      # ── Generate ExportOptions.plist (manual App Store signing) ───────────
      # Written at runtime so the provisioning-profile NAME and team come from
      # secrets rather than being committed with a guessed value.
      - name: Generate ExportOptions.plist
        env:
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          TEAM="${APPLE_TEAM_ID:-X8JCSQZDGC}"
          if [ -z "${IOS_PROVISIONING_PROFILE_NAME:-}" ]; then
            echo "::error::IOS_PROVISIONING_PROFILE_NAME secret is empty. Set it to the exact name of your App Store provisioning profile."
            exit 1
          fi
          # Build the plist with PlistBuddy (avoids heredoc indentation pitfalls
          # and shell-escaping of the profile name / bundle id).
          PB=/usr/libexec/PlistBuddy
          rm -f "$EXPORT_OPTIONS_PATH"
          "$PB" -c "Add :method string app-store" "$EXPORT_OPTIONS_PATH"
          "$PB" -c "Add :teamID string ${TEAM}" "$EXPORT_OPTIONS_PATH"
          "$PB" -c "Add :signingStyle string manual" "$EXPORT_OPTIONS_PATH"
          "$PB" -c "Add :stripSwiftSymbols bool true" "$EXPORT_OPTIONS_PATH"
          "$PB" -c "Add :uploadBitcode bool false" "$EXPORT_OPTIONS_PATH"
          "$PB" -c "Add :uploadSymbols bool true" "$EXPORT_OPTIONS_PATH"
          "$PB" -c "Add :provisioningProfiles dict" "$EXPORT_OPTIONS_PATH"
          "$PB" -c "Add :provisioningProfiles:${IOS_BUNDLE_ID} string ${IOS_PROVISIONING_PROFILE_NAME}" "$EXPORT_OPTIONS_PATH"
          echo "ExportOptions.plist written (method=app-store, signingStyle=manual, team=${TEAM})."

      # ── Final pre-archive diagnostics (immediately before the build) ──────
      # Captures the AUTHORITATIVE state the archive will see, right before
      # `flutter build ipa`. `flutter build ios --config-only` re-runs the same
      # plugin generation / build-prep as the real build, so if SwiftPM
      # re-migration happens it surfaces HERE (steps 207/332 run earlier and
      # could be undone by build-prep). Inspects the native SDK module, the
      # CocoaPods target graph, the Xcode search paths, and which target
      # compiles RazorpayDelegate.swift. No secrets are read or printed.
      - name: Final pre-archive diagnostics (RazorpayCore)
        run: |
          set -uo pipefail   # not -e: diagnostics must run to completion
          echo "::group::Re-run build-prep (config only, no codesign)"
          flutter build ios --config-only --no-codesign --release || true
          echo "::endgroup::"

          PBX="ios/Runner.xcodeproj/project.pbxproj"
          PODS="ios/Pods"

          echo "::group::C. Xcode project: SwiftPM integration after build-prep (EXPECTED now)"
          if grep -Eiq 'FlutterGeneratedPluginSwiftPackage|XCSwiftPackageProductDependency|XCLocalSwiftPackageReference' "$PBX"; then
            echo "SwiftPM integration PRESENT (expected): razorpay_flutter 1.4.7 resolves RazorpayCore via SPM."
            grep -nEi 'FlutterGeneratedPluginSwiftPackage|XCSwiftPackageProductDependency|XCLocalSwiftPackageReference' "$PBX" | head -n 30
          else
            echo "::warning::No SwiftPM integration in project.pbxproj. razorpay_flutter must then resolve RazorpayCore via the CocoaPods fallback (razorpay-pod)."
          fi
          echo "── SPM-resolved razorpay-pod / RazorpayCore checkout (DerivedData SourcePackages) ──"
          find ~/Library/Developer/Xcode/DerivedData -ipath '*razorpay-pod*' 2>/dev/null | head -n 20 || true
          find ~/Library/Developer/Xcode/DerivedData -iname '*RazorpayCore*' 2>/dev/null | head -n 20 || true
          echo "::endgroup::"

          echo "::group::A. Native SDK: razorpay-pod framework + module map"
          RZDIR="$PODS/razorpay-pod"
          if [ -d "$RZDIR" ]; then
            echo "razorpay-pod contents:"; find "$RZDIR" -maxdepth 4 \( -name '*.framework' -o -name '*.xcframework' -o -name '*.modulemap' -o -name 'module.modulemap' \) -print
            echo "── module maps found (prove whether RazorpayCore is a module) ──"
            find "$RZDIR" -name '*.modulemap' -print -exec sh -c 'echo "---- $1 ----"; cat "$1"' _ {} \;
            echo "── framework binaries + their Swift module dirs ──"
            find "$RZDIR" -name '*.framework' -type d -print -exec sh -c 'echo "Modules/ of $1:"; ls -la "$1/Modules" 2>/dev/null || echo "(no Modules dir)"' _ {} \;
            echo "── nm/strings scan for RazorpayCore symbol/module names (best-effort) ──"
            BIN="$(find "$RZDIR" -type f \( -name 'Razorpay' -o -name 'RazorpayCore' \) 2>/dev/null | head -n1)"
            if [ -n "${BIN:-}" ]; then
              echo "binary: $BIN"; otool -L "$BIN" 2>/dev/null | head -n 20 || true
            fi
          else
            echo "::warning::$RZDIR not found."
          fi
          # Does ANY module named RazorpayCore exist anywhere under Pods?
          echo "── Any 'RazorpayCore' module/swiftmodule under Pods? ──"
          find "$PODS" -iname '*RazorpayCore*' 2>/dev/null | sort -u || true
          echo "::endgroup::"

          echo "::group::B. CocoaPods target graph (razorpay_flutter -> razorpay-pod)"
          echo "Podfile.lock razorpay deps:"; grep -iE 'razorpay' ios/Podfile.lock || true
          echo "Manifest.lock razorpay deps:"; grep -iE 'razorpay' "$PODS/Manifest.lock" 2>/dev/null || true
          echo "Pods project targets/refs mentioning razorpay (from Pods.xcodeproj):"
          grep -oiE 'name = "?razorpay[^";]*"?' "$PODS/Pods.xcodeproj/project.pbxproj" 2>/dev/null | sort -u || echo "(Pods.xcodeproj not found)"
          echo "razorpay_flutter target's dependency on razorpay-pod (xcconfig inheritance):"
          grep -iE 'razorpay-pod|razorpay_pod' "$PODS/Target Support Files/razorpay_flutter/razorpay_flutter.release.xcconfig" 2>/dev/null || echo "(no direct razorpay-pod reference in razorpay_flutter xcconfig)"
          echo "::endgroup::"

          echo "::group::C/D. Build settings for razorpay_flutter target (search paths, xcconfig)"
          # Ask xcodebuild for the EFFECTIVE settings the razorpay_flutter pod
          # target compiles with. This shows FRAMEWORK/HEADER/SWIFT search paths
          # and whether the CocoaPods modulemap for razorpay-pod is on the path.
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -showBuildSettings -target razorpay_flutter 2>/dev/null \
            | grep -iE 'FRAMEWORK_SEARCH_PATHS|HEADER_SEARCH_PATHS|SWIFT_INCLUDE_PATHS|OTHER_SWIFT_FLAGS|OTHER_LDFLAGS|MODULEMAP|DEFINES_MODULE|razorpay' \
            || echo "(razorpay_flutter target not directly queryable; dumping Pods xcconfig instead)"
          echo "── razorpay_flutter pod xcconfig (release) ──"
          cat "$PODS/Target Support Files/razorpay_flutter/razorpay_flutter.release.xcconfig" 2>/dev/null || echo "(not found)"
          echo "── Pods-Runner xcconfig (release) razorpay/search-path lines ──"
          grep -iE 'razorpay|FRAMEWORK_SEARCH_PATHS|HEADER_SEARCH_PATHS|OTHER_SWIFT_FLAGS|SWIFT_INCLUDE_PATHS' \
            "$PODS/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig" 2>/dev/null || echo "(not found)"
          echo "::endgroup::"

          echo "Pre-archive diagnostics complete (non-fatal; see groups above)."

      # ── Build the signed release IPA ──────────────────────────────────────
      # flutter build ipa drives `xcodebuild archive` + `-exportArchive` using
      # our ExportOptions.plist, so the archive is signed with the Apple
      # Distribution identity + App Store profile imported above.
      - name: Build signed IPA
        env:
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # Keep the temp keychain unlocked for the whole xcodebuild run.
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          flutter build ipa --release \
            --build-name="${{ steps.vn.outputs.version_name }}" \
            --build-number="${{ steps.bn.outputs.build_number }}" \
            --export-options-plist="$EXPORT_OPTIONS_PATH"

      # ── Verify the IPA exists and is non-empty ────────────────────────────
      - name: Verify IPA
        id: ipa
        run: |
          set -euo pipefail
          echo "Contents of build/ios/ipa:"
          ls -l build/ios/ipa/ || {
            echo "::error::build/ios/ipa does not exist. The archive/export step did not produce an IPA (check signing errors above)."
            exit 1
          }
          IPA="$(ls -1 build/ios/ipa/*.ipa 2>/dev/null | head -n1 || true)"
          if [ -z "${IPA:-}" ] || [ ! -s "$IPA" ]; then
            echo "::error::No non-empty .ipa found under build/ios/ipa/."
            exit 1
          fi
          # Resolve to an absolute path without relying on python.
          ABS="$(cd "$(dirname "$IPA")" && pwd)/$(basename "$IPA")"
          echo "IPA OK: $ABS ($(stat -f%z "$ABS") bytes)"
          echo "abs_path=$ABS" >> "$GITHUB_OUTPUT"

      # ── Upload the IPA as a workflow artifact (traceability) ──────────────
      # actions/upload-artifact v4.6.2 (same pin as Android).
      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-release-${{ steps.bn.outputs.build_number }}.ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      # ── Verify the built IPA's Info.plist BEFORE uploading ────────────────
      # Gates the TestFlight upload on the exact identity/version Apple checks:
      #   CFBundleIdentifier        == io.app.opdsure
      #   CFBundleShortVersionString == 2.0.3  (marketing version; must be > 2.0.2)
      #   CFBundleVersion           == the ASC-derived build number
      # Also re-prints the selected Xcode, iOS SDK, resolved version + build
      # number for the record. Fails the job if any check mismatches. No secrets.
      - name: Verify IPA Info.plist (identity + version) before upload
        env:
          EXPECTED_VERSION: "2.0.3"
          EXPECTED_BUILD: ${{ steps.bn.outputs.build_number }}
          IPA_PATH: ${{ steps.ipa.outputs.abs_path }}
        run: |
          set -euo pipefail
          echo "── Toolchain recap ──"
          xcodebuild -version | head -n1
          echo "iphoneos SDK = $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Resolved version name = ${{ steps.vn.outputs.version_name }}"
          echo "Resolved build number = ${EXPECTED_BUILD}"

          if [ ! -s "${IPA_PATH:-}" ]; then
            echo "::error::IPA_PATH (${IPA_PATH:-<empty>}) missing/empty before Info.plist check."
            exit 1
          fi

          WORK="$RUNNER_TEMP/ipa_inspect"
          rm -rf "$WORK"; mkdir -p "$WORK"
          unzip -q "$IPA_PATH" -d "$WORK"
          PLIST="$(find "$WORK/Payload" -maxdepth 2 -name 'Info.plist' | head -n1)"
          if [ -z "${PLIST:-}" ]; then
            echo "::error::Could not locate Payload/*.app/Info.plist inside the IPA."
            exit 1
          fi
          PB=/usr/libexec/PlistBuddy
          BID="$("$PB" -c 'Print :CFBundleIdentifier' "$PLIST")"
          SHORT="$("$PB" -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$("$PB" -c 'Print :CFBundleVersion' "$PLIST")"
          echo "IPA CFBundleIdentifier        = ${BID}"
          echo "IPA CFBundleShortVersionString = ${SHORT}"
          echo "IPA CFBundleVersion            = ${BUILD}"

          FAIL=0
          [ "${BID}" = "${IOS_BUNDLE_ID}" ] || { echo "::error::CFBundleIdentifier '${BID}' != '${IOS_BUNDLE_ID}'."; FAIL=1; }
          [ "${SHORT}" = "${EXPECTED_VERSION}" ] || { echo "::error::CFBundleShortVersionString '${SHORT}' != '${EXPECTED_VERSION}' (must be > 2.0.2)."; FAIL=1; }
          [ "${BUILD}" = "${EXPECTED_BUILD}" ] || { echo "::error::CFBundleVersion '${BUILD}' != generated build number '${EXPECTED_BUILD}'."; FAIL=1; }
          rm -rf "$WORK" || true
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "Info.plist verified: ${BID} ${SHORT} (${BUILD}). Proceeding to upload."

      # ── Upload to App Store Connect (TestFlight) ──────────────────────────
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # ASC_KEY_PATH + IPA_PATH consumed by the Fastfile `beta` lane.
          IPA_PATH: ${{ steps.ipa.outputs.abs_path }}
        working-directory: ios
        run: |
          set -euo pipefail
          if [ ! -s "${IPA_PATH:-}" ]; then
            echo "::error::IPA_PATH (${IPA_PATH:-<empty>}) is missing or empty right before upload."
            exit 1
          fi
          bundle exec fastlane beta

      # ── Always clean up decoded credentials + temp keychain ───────────────
      - name: Clean up signing material
        if: ${{ always() }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$CERTIFICATE_PATH" "$PROFILE_PATH" "$ASC_KEY_PATH" "$EXPORT_OPTIONS_PATH" || true
          if [ -n "${PROVISIONING_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROVISIONING_PROFILE_UUID}.mobileprovision" || true
          fi
          echo "Removed temporary keychain, certificate, profile and API key."
